name: Build Electron ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Matches standard LTS Node versions
        cache: 'npm'

    - name: Set Architecture Environment Variables
      run: |
        echo "npm_config_arch=arm64" >> $env:GITHUB_ENV
        echo "npm_config_target_arch=arm64" >> $env:GITHUB_ENV

    - name: Install Dependencies
      run: npm install

    - name: Rebuild Native Modules for ARM64
      run: npx electron-rebuild --arch arm64

    - name: Build Electron Executable
      run: npx electron-builder --win --arm64 --publish never

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: electron-win32-arm64
        path: |
          C:/temp/theconvertor-release/*.exe
          C:/temp/theconvertor-release/*.blockmap
