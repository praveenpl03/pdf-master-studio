
    
  
name: pdf-master-studio
base: core24
title: PDF Master Studio
version: '3.0.0'
summary: PDF editing and management desktop application

description: |
  PDF Master Studio is a desktop application for viewing,
  editing, and managing PDF documents.

contact:
  - https://github.com/praveenpl03/pdf-master-studio/issues

issues:
  - https://github.com/praveenpl03/pdf-master-studio/issues

source-code:
  - https://github.com/praveenpl03/pdf-master-studio

website: https://github.com/praveenpl03/pdf-master-studio

# Set this to the actual license of your project.
license: MIT

grade: stable
confinement: strict

apps:
  pdf-master-studio:
    command: bin/launch.sh
    desktop: meta/gui/pdf-master-studio.desktop
    extensions:
      - gnome
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - browser-support

parts:
  pdf-master-studio:
    plugin: nil
    source: .
    build-snaps:
      - node/24/stable
    build-packages:
      - ca-certificates
      - python3
      - make
      - g++
    override-build: |

      set -eu
      mkdir -p "$SNAPCRAFT_PART_INSTALL/meta/gui"

      cp snap/meta/gui/pdf-master-studio.desktop \
        "$SNAPCRAFT_PART_INSTALL/meta/gui/"

      cp snap/meta/gui/pdf-master.png \
        "$SNAPCRAFT_PART_INSTALL/meta/gui/"
      echo "Installing project dependencies..."
      npm ci --include=dev
      rm -f node_modules/@electron-internal/extract-zip/index.linux-x64-musl.node
      echo "Installing llama.cpp runtime..."

      mkdir -p \
        "$SNAPCRAFT_PART_INSTALL/resources/llama"

      cp -a build/linux \
        "$SNAPCRAFT_PART_INSTALL/resources/llama/"

      chmod 755 \
        "$SNAPCRAFT_PART_INSTALL/resources/llama/linux/llama-server"

      test -x \
        "$SNAPCRAFT_PART_INSTALL/resources/llama/linux/llama-server"

      echo "llama.cpp runtime installed."
      echo "Downloading the Electron runtime..."
      node node_modules/electron/install.js

      echo "Checking Electron executable..."

      if [ ! -x node_modules/electron/dist/electron ]; then
      echo "ERROR: Electron executable was not installed."
      ls -la node_modules/electron/
      ls -la node_modules/electron/dist/ || true
      exit 1
      fi

      echo "Electron executable found."

      echo "Building Angular application..."
      npm run build

      test -f dist/theconvertor/browser/index.html

      echo "Preparing Snap application..."
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"

      cp -a electron dist node_modules package.json \
        "$SNAPCRAFT_PART_INSTALL/"

      cat > "$SNAPCRAFT_PART_INSTALL/bin/launch.sh" <<'EOF'
      #!/bin/sh
      set -eu

      export ELECTRON_DISABLE_SECURITY_WARNINGS=1

      exec "$SNAP/node_modules/electron/dist/electron" \
          "$SNAP" \
          --no-sandbox \
          --disable-setuid-sandbox \
          --disable-gpu \
          --disable-gpu-compositing \
          --disable-vulkan \
          --ozone-platform=x11
      EOF

      chmod 755 "$SNAPCRAFT_PART_INSTALL/bin/launch.sh"

      echo "Electron and Angular staging completed."
    stage-packages:
      - libnss3
      - libnspr4
      - libx11-xcb1
      - libxcb-dri3-0
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2t64
      - libatspi2.0-0t64
      - libgtk-3-0t64
      - libdrm2
      - libxshmfence1

